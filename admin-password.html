<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kofeely Coffee – Change Admin Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">
    <div class="admin-header">
      <span class="admin-badge">Admin</span>
      <img src="/assets/logo.png" alt="Kofeely Coffee" class="logo">
      <h2 class="brand-name">Kofeely Coffee</h2>
    </div>

    <div class="top-links">
      <a href="/admin">← Back</a>
      <span></span>
    </div>

    <h1 class="page-title" style="font-size:1.2rem;">Change Admin Password</h1>

    <form id="passForm" autocomplete="off" style="width:100%;">
      <div class="form-group">
        <label for="currentPass">Current Admin Password</label>
        <input type="password" id="currentPass" placeholder="Enter current password" required>
      </div>
      <div class="form-group">
        <label for="newPass">New Admin Password</label>
        <input type="password" id="newPass" placeholder="At least 8 characters" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary">Update</button>
    </form>

    <div id="errorMsg" class="msg-error"></div>
    <div id="successMsg" class="msg-success"></div>
  </div>

  <script>
    const form = document.getElementById('passForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      successMsg.textContent = '';

      const current_password = document.getElementById('currentPass').value;
      const new_password = document.getElementById('newPass').value;

      if (!current_password || !new_password) return;

      try {
        const res = await fetch('/api/admin/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current_password, new_password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error;
          return;
        }

        successMsg.textContent = data.message;
        form.reset();
      } catch (err) {
        errorMsg.textContent = 'Something went wrong. Please try again.';
      }
    });
  </script>
</body>
</html>
